[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-navigator"
version = "0.1.1a1"
description = "Passive minimap-based position estimator"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<12",
  "pywebview>=5,<7; platform_system == 'Windows'",
]

[project.scripts]
genshin-navigator = "genshin_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
